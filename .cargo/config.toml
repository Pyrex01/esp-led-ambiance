[target.xtensa-esp32s3-none-elf]
# Erasing otadata makes a USB flash boot the ota_0 image it just wrote, even
# after OTA updates have switched the device to ota_1.
runner = "espflash flash --monitor --chip esp32s3 --erase-parts otadata"

[env]
ESP_LOG="info"

[build]
rustflags = [
  "-C", "link-arg=-nostartfiles",
]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["core", "alloc"]
