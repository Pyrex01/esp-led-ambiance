[package]
edition      = "2024"
name         = "practice-esp"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "practice-esp"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy", "esp32s3", "esp-alloc", "esp-radio", "log-04"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-net      = { version = "0.7.1", features = ["dhcpv4", "medium-ethernet", "tcp"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embedded-io-async = "0.6.1"
esp-alloc        = { version = "0.10.0", features = ["esp32s3"] }
esp-println      = { version = "0.17.0", features = ["esp32s3", "log-04"] }
esp-radio        = { version = "0.18.0", features = ["esp32s3", "esp-alloc", "log-04", "wifi"] }
heapless         = "0.9.1"
smoltcp          = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "multicast", "proto-dhcpv4", "proto-ipv4", "socket-icmp", "socket-raw", "socket-tcp", "socket-udp"] }

critical-section = "1.2.0"
embedded-storage = "0.3.1"
static_cell      = "2.1.1"
picoserve = { version = "0.17.1", default-features = false, features = ["embassy", "log", "ws"] }
esp-storage = { version = "0.7.0", features = ["esp32s3"] }

[features]
# Build for the Wokwi simulator (connects to the virtual "Wokwi-GUEST" access point).
wokwi = []

[build-dependencies]
flate2   = "1.0"
walkdir  = "2.5.0"
# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
