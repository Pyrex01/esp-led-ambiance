[package]
name = "practice-esp-desktop"
version = "0.1.0"
description = "Windows and Linux desktop companion for the ESP32 ambient lighting controller"
authors = ["you"]
edition = "2021"

[lib]
name = "practice_esp_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
xcap = "0.9.8"
